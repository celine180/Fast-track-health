<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body class="big-light">
<form>
  <div class="row mb-3">
    <label for="inputEmail3" class="sm:col-2 col-form-label">Email</label>
    <div class="sm:col-10">
      <input type="email" class="form-control" id="inputEmail3">
    </div>
  </div>
  <div class="row mb-3">
    <label for="inputPassword3" class="sm:col-2 col-form-label">Password</label>
    <div class="sm:col-10">
      <input type="password" class="form-control" id="inputPassword3">
    </div>
  </div>
  <div class="row mb-3">
    <div class="sm:col-10 sm:offset-2">
      <div class="form-field">
        <input type="checkbox" id="gridCheck1" class="check">
        <label for="gridCheck1">
          Rember me
        </label>
      </div>
    </div>
  </div>
  <button type="submit" class="btn-solid theme-primary">Sign in</button>
</form>

   
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  </body>
</html>
