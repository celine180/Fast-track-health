<!doctype html>
<html lang="en" data-bs-theme="white">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Appointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>  
<body>
   <div class="container mt-5">
    <div class="row justfy-content-center">
    <body style="background-image: url(galpin1.jpg); background-size: cover; background-position: center; background-repeat: no-repeat; height: 100vh;">
  <div id="header"></div>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 border rounded-3 p-4 shadow-sm">
        <h1>Book an appointment</h1>
        <p class="lead">Please fill the details below correctly</p>
        </div>
  <div class="card-body p-4">
    <form>
      <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" class="form-control" placeholder="Your Name" required>
  </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
    <div class="input-group">
      <input type="email" class="form-control" placeholder="you@gmail.com" required>
    </div>
  </div>
<div class="mb-3">
<label for="doctorselect" class="form label">select doctor:</label>
<select class="form select" id="doctorselect" required>
<option value=""selected disabled>choose  a healthcare professional</option>
<option value="dr best">DR.Mark Best-ENT</option>
<option value="dr lucky">DR.Irankunda Lucky-DENTIST</option>
<option value="dr treasure">DR.Namutebi Treasure-ORTHOPEDIC</option>
<option value="dr salimu">DR.Salimu Banuli-GENERAL</option>
<option value="dr kade">DR.Kade Brenda-NUTRITIONIST</option>
</select>
</div>
<div class="mt-4">
<button type="submit">submit</button>
</div>
  <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>
  </body>
</html>
