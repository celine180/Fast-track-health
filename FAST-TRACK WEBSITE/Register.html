<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAST-TRACK CLINIC DISPENSARY MODEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
<div id="header"></div>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-3 p-4">
              <h1 class="card-title mb-4" >Register</h1>
              <p class="card-text mb-4">Create a new account to access our services.</p>
    <form class="row g-3">
  <div class="md:col-6">
    <label for="inputEmail4" class="form-label">Email</label>
    <input type="email" class="form-control" id="inputEmail4" placeholder="you@example.com" required>
  </div>
  <div class="md:col-6">
    <label for="inputPassword4" class="form-label">Password</label>
    <input type="password" class="form-control" id="inputPassword4" placeholder="••••••••" required>
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label">Address</label>
    <input type="text" class="form-control" id="inputAddress" required>
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Address 2</label>
    <input type="text" class="form-control" id="inputAddress2">
  </div>
  <div class="md:col-6">
    <label for="inputCity" class="form-label">City</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="md:col-4">
    <label for="inputState" class="form-label">Country</label>
    <select id="inputState" class="form-control">
      <option selected>Choose...</option>
      <option> Uganda</option>
      <optgroup label="Other Countries">
        <option>Kenya</option>
        <option>Tanzania</option>
        <option>Rwanda</option>
    </select>
  </div>
  <div class="col-12">
    <div class="form-field">
      <input type="checkbox" id="gridCheck" class="check">
      <label for="gridCheck">
        Check me out
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary w-100">Sign in</button>
  </div>
  </form>
  
          </div>
        </div>
      </div>
    </div>
  <link rel="stylesheet" href="register-style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>
</body>
</html>
