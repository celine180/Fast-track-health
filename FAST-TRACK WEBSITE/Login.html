<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Fast Track Model</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="header"></div>

  <div class="container mt-5">
    <div class="row justfy-content-center">
    <body style="background-image: url(login-photo.jpg); background-size: cover; background-position: center; background-repeat: no-repeat; height: 100vh;">
    <div class="col-md-6 border border-primary border-2 rounded-3 p-4">
      <h1>Welcome Back!</h1>
      <p class="lead">Please login to your account</p>
    <h3>Login</h3>
    <p class="subtext">Doesn't have an account yet? <a href="Register.html" target="_blank">Sign Up</a></p>
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';"> <!--Prevents page from refreshing after submitting in the login-->
      
      <div class="mb-3"><!--Creates spaces after the button before the next button-->
    <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="alwaysFloatingInput" placeholder="name@example.com" required>
    <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
      <label for="alwaysFloatingPassword">Password</label>
  <input type="password" class="form-control" id="alwaysFloatingPassword" placeholder="••••••••" required minlength="4" maxlength="6">
  <div class="col-auto">
    <span id="passwordHelpInline" class="form-text">
      Must be 4-6 characters long.
    </span>
  </div>
  </div>  
  <div class="mb-3 form-check">
    <input type="checkbox" id="exampleCheck1" class="form-check-input">
    <label class="form-check-label" for="exampleCheck1">Remember Me</label>
  </div>
  <button type="submit" class="btn btn-primary">LOGIN</button>
  </form>
<link rel="stylesheet"href="login-style.css">    
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</div>
</div>
</div>
  <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>
</body>
</html>
