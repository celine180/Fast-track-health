<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Fast Track Model</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="login-card">
  <div class="left-form">
    <h3>Login</h3>
    <p class="subtext">Doesn't have an account yet? <a href="Register.html" target="_blank">Sign Up</a></p>
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';"> <!--Prevents page from refreshing after submitting in the login-->
      <div class="mb-3"><!--Creates spaces after the button before the next button-->
        <label class="form-label small">Email Address</label>
        <input type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-2">
        <label class="form-label small">Password <a href="#" style="float:right; font-size:12px; color:#7c3aed; text-decoration:none;">Forgot Password?</a></label>
        <input type="password" class="form-control" placeholder="Enter 6 character or more" required minlength="6">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label small text-muted" for="remember">Remember me</label>
      </div>
      <button type="submit" class="btn-login">LOGIN</button>
      <div class="divider">or login with</div>
      <div class="social-btns">
        <button type="button" class="social-btn">G Google</button>style="color:#7c3aed;
      </div>
    </form>
    <p class="mt-4 text-center"><a href="index.html" style="color:#7c3aed; font-size:12px; text-decoration:none;">← Back to Home</a></p>
  </div>
  <div class="right-illust">
    <img src="photo.jpeg" style="max-width:100%;">
  </div>
</div>
<link rel="stylesheet"href="style.css">
</body>
</html>
