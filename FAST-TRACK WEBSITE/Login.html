<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Fast Track Model</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="login-card">
  <div class="left-form">
    <h3>Login</h3>
    <p class="subtext">Doesn't have an account yet? <a href="Register.html" target="_blank">Sign Up</a></p>
    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';"> <!--Prevents page from refreshing after submitting in the login-->
      <div class="mb-3"><!--Creates spaces after the button before the next button-->

        <form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="alwaysFloatingInput" placeholder="name@example.com">
    <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
      <label for="alwaysFloatingPassword">Password</label>
  <input type="password" class="form-control" id="alwaysFloatingPassword" placeholder="••••••••">
  </div>
  <div class="mb-3 form-field">
    <input type="checkbox" id="exampleCheck1" class="check">
    <label for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn-solid theme-primary">LOGIN</button>
</form>
      <div class="divider">or login with</div>
      <div class="social-btns">
        <button type="button" class="social-btn" onclick="window.open('https://accounts.google.com/o/oauth2/auth', '_blank')">G Google</button>
      </div>
    </form>
    <p class="mt-4 text-center"><a href="homepage.html" target="_blank" style="color:#7c3aed; font-size:12px; text-decoration:none;">← Back to Home</a></p>
  </div>
  <figure class="figure align-items-end">
  <img src="login-image.jpeg" class="img-fluid rounded-3" alt="...">
  </figure>
</div>
<link rel="stylesheet"href="login-style.css">
</body>
</html>
