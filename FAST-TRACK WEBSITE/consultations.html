<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FAST TRACK - CONSULT US</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" 
    crossorigin="anonymous">
</head>
<body>
   <div class="container mt-5">
    <div class="row justfy-content-center">
    <body style="background-image: url(galpin1.jpg); background-size: cover; background-position: center; background-repeat: no-repeat; height: 100vh;">
  <div id="header"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" 
    crossorigin="anonymous"></script>
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
  </script>

<div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 bg-primary p-4 rounded  ">
        <h3 class="text-center mb-1">CONSULT US</h3>
        
       
<form>
          <div class="mb-3">
            <label for="name" class="form-label">Your Full Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name">
            
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="+256 7xx xxx xxx" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message </label>
            <textarea class="form-control" id="message" rows="3" placeholder="Write your message here" required></textarea>
          </div>
          <button type="submit" class="btn-solid theme-success">Send  Message</button>
        </form>
      </div>
    </div>
  </div>
  <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("consultForm").addEventListener("submit", function(e) {
    e.preventDefault(); // Stop the page from reloading

    // 1. Get what the user typed
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let message = document.getElementById("message").value;

    // 2. Build the WhatsApp message
    let text = "Hello Fast Track Consult,%0A%0A" +
               "Name: " + name + "%0A" +
               "Email: " + email + "%0A" +
               "Phone: " + phone + "%0A" +
               "Message: " + message;

    // 3. Open WhatsApp with YOUR number
    let myNumber = "0772206394"; // <-- CHANGE THIS TO YOUR NUMBER
    window.open("https://wa.me/" + myNumber + "?text=" + text, "_blank");
  });
</script>
<script>

    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
    fetch("footer.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
  </script>
  
</body>
</html>
