<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CONTACT US</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" 
    crossorigin="anonymous">
    
</head>
<body  >
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-success p-4 rounded shadow-sm">
                <h3 class="text-center mb-1">consult us</h3>

                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your first name">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Second Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your second name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" placeholder="+256 700 000000">
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" class="form-control" id="subject"
                            placeholder="e.g. Inquiry about services,prescription,Home visit">
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message </label>
                        <textarea class="form-control" id="message" rows="3"
                            placeholder="Send your message here OR Feedback about service"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
